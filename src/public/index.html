<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="description" content="中书的第一步：一个简单、可追踪的发布起点。">
  <title>中书 · Zhongshu</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><img src="/icon.svg" width="40" height="40" alt=""><span>中书 <small>ZHONGSHU</small></span></header>
    <p class="eyebrow">THE FIRST STEP</p>
    <h1>从这里，开始。</h1>
    <p class="intro">一个简单、可追踪的发布起点。</p>
    <section aria-label="运行状态">
      <div class="status" role="status"><span class="dot" id="dot"></span><span id="status">正在连接服务…</span></div>
      <dl>
        <div><dt>应用版本</dt><dd id="version">—</dd></div>
        <div><dt>构建提交</dt><dd><code id="revision">—</code></dd></div>
      </dl>
      <button type="button" id="refresh">重新检查</button>
    </section>
    <footer>保持简单，一步一步。</footer>
  </main>
</body>
</html>
