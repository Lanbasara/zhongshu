name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check documentation
        run: npm run check:docs
      - run: npm run typecheck && npm test && npm run build
        env:
          REVISION: ${{ github.sha }}
      - name: Build and check the actual container
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --build-arg REVISION="$REVISION" -t zhongshu-check .
          export IMAGE=zhongshu-check
          trap 'timeout 30s docker compose --project-name zhongshu-check down --volumes >/dev/null' EXIT
          docker compose --project-name zhongshu-check up -d --wait --wait-timeout 60
          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:8787/api/version > /tmp/version.json; then break; fi
            sleep 1
          done
          jq -e --arg revision "$REVISION" '.revision == $revision' /tmp/version.json
          node scripts/check-container.mjs

