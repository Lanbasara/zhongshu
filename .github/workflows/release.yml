name: Release
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  eligible:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit integrated into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  check:
    needs: eligible
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [eligible, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image repository
        id: repository
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.repository.outputs.name }}:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        id: reference
        env:
          REPOSITORY: ${{ steps.repository.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "image=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published: \`$REPOSITORY@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.publish.outputs.image }}
      revision: ${{ github.sha }}
    secrets: inherit
